name: Trusted downloader maintenance
on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build a new tested release even without an engine change
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: trusted-downloader-maintenance
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  prepare:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.candidate.outputs.build }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/family-freeware-hardening-20261023
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: candidate
        name: Pin stable engine candidate and version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force }}
        shell: pwsh
        run: |
          $arguments = @('maintenance.py', 'prepare')
          if ($env:FORCE_RELEASE -eq 'true') { $arguments += '--force' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install hash-locked build and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build-win.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-release-win.lock
          python -m pip install --require-hashes -r requirements-test-win.lock
      - name: Security and consumer regression checks
        run: |
          python -m pytest -q test_main.py test_unsigned_release.py test_publisher_update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test_promo.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real guarded download and decoded output
        run: python maintenance.py smoke --source '${{ needs.prepare.outputs.sha }}'
      - name: Prepare pinned runtime
        run: python prepare_bundle.py --release-lock bundle-release-lock.json
      - name: Install Inno Setup compiler
        run: choco install innosetup --version=6.4.3 -y --no-progress
      - name: Build complete Windows installer
        run: python build_unsigned.py
      - name: Assemble canonical installer, licenses and corresponding source
        run: python maintenance_assets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-unsigned-candidate
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
  sign:
    needs: [prepare, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-signing-win.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-unsigned-candidate
          path: release-assets/
      - name: Sign tested bytes with publisher key
        env:
          PUBLISHER_UPDATE_KEY: ${{ secrets.PUBLISHER_UPDATE_KEY }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python maintenance.py sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-candidate
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
  transition:
    needs: [prepare, sign]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-signing-win.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-candidate
          path: release-assets/
      - name: Actual old-to-new installer, helper and relaunch test
        run: python ci_transition.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transition-logs
          path: ${{ runner.temp }}/ssak-update-transition/profile/SsakSsakKimchiDownloader/*.log
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [prepare, transition]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-signing-win.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-candidate
          path: release-assets/
      - name: Publish exact tested bytes and update authenticated channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python maintenance.py publish
  refresh:
    needs: prepare
    if: needs.prepare.outputs.build == 'false'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-signing-win.lock
      - name: Renew authenticated unchanged channel TTL
        env:
          PUBLISHER_UPDATE_KEY: ${{ secrets.PUBLISHER_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance.py refresh
